<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #060e0e;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,188,212,0.18) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .logo-ring {
    width: 100px; height: 100px; border-radius: 50%;
    border: 3px solid rgba(0,188,212,0.6);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(0,188,212,0.3);
  }
  .logo-inner {
    width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,188,212,0.25) 0%, rgba(0,188,212,0.05) 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .wave-bars {
    display: flex; align-items: center; gap: 5px;
  }
  .bar { width: 6px; border-radius: 3px; background: #00BCD4; }
  h1 {
    color: #fff; font-size: 72px; font-weight: 800;
    letter-spacing: -0.02em; line-height: 1;
  }
  h1 span { color: #00BCD4; }
  p {
    color: rgba(255,255,255,0.55); font-size: 26px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="logo-ring">
      <div class="logo-inner">
        <div class="wave-bars">
          <div class="bar" style="height:18px"></div>
          <div class="bar" style="height:32px"></div>
          <div class="bar" style="height:24px"></div>
          <div class="bar" style="height:38px"></div>
          <div class="bar" style="height:20px"></div>
        </div>
      </div>
    </div>
    <h1>Stoo<span>orna</span></h1>
    <p>Voice · Whisper · Connect</p>
  </div>
</body>
</html>
